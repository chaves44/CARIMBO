name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk CARIMBO-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CARIMBO-apk
          path: CARIMBO-${{ github.run_number }}.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CARIMBO 1.0.${{ github.run_number }}
          files: CARIMBO-${{ github.run_number }}.apk
